  <line class="sr-e4" pathLength="1" x1="16.6" y1="40.3" x2="40.6" y2="28.8" opacity=".6"/>
  <line class="sr-e5" pathLength="1" x1="24" y1="8" x2="40.6" y2="28.8" opacity=".6"/>
  <circle class="sr-ring" cx="40.6" cy="28.8" r="4" opacity="0" stroke="#e0707f"/>
</g></g>
<g class="sig" opacity=".45"><path class="ss-in" pathLength="24" stroke="#e0707f" stroke-width="1.5" fill="none" d="M700 40 C710 24,720 24,730 40 S750 58,760 40 S780 22,790 40 S806 52,816 40"/></g>
<text x="40" y="52" font-size="26" font-weight="800" fill="#e6edf3">이주형 <tspan font-size="14" font-weight="500" fill="#8b949e">Lee Ju Hyeong · AI Application Engineer</tspan></text>
