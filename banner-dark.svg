<text class="mono" x="700" y="152" font-size="21" font-weight="700" fill="#e0707f">인문학 → AI<tspan font-size="13" fill="#8b949e"> </tspan></text>
<text class="mono" x="700" y="172" font-size="10" fill="#e6edf3" opacity=".85">탐색 연구 — 로켓단</text>
