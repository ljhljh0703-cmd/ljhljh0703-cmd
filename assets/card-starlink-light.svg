<style>
text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif} .mono{font-family:'SF Mono','JetBrains Mono',Consolas,monospace}

@keyframes sigPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}
